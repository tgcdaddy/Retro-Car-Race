<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Enduro</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Enduro">
<meta name="theme-color" content="#000000">
<meta name="format-detection" content="telephone=no">
<style>
html,body{margin:0;padding:0;width:100%;height:100%;background:#000;overflow:hidden;position:fixed;
-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
touch-action:none;overscroll-behavior:none}
canvas{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:block;
image-rendering:-moz-crisp-edges;image-rendering:pixelated;touch-action:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function(){
'use strict';

/* =====================================================================
   ENDURO  -  single file retro racer (ES5, touch first)
   Colours: see the palette block (DAYC / DUSKC / NIGHTC / DAWNC).
   Everything is drawn in "logical pixels" and snapped to real device
   pixels, so the picture stays razor sharp on any screen.
   ===================================================================== */

var W = 160, H = 300, Q = 4, isLand = false;
var cv = document.getElementById('c');
var ctx = cv.getContext('2d');
var vw = 360, vh = 640, dpr = 1;
var PANEL = 86, TOPPAD = 14, roadBottom = 0, horizon = 0, roadH = 0, HWB = 100, CARK = 33;
var PLAYERP = 0.97;

/* ---------- tuning ---------- */
var ZS = 0.09;           // world units per mph per second
var ZMAX = 34;           // spawn depth
var ZLO = 0.95, ZHI = 1.12, ZPASS = 0.93, LAT = 0.31;
var DAYLEN = 110;        // seconds per day
var LANES = [-0.75, -0.25, 0.25, 0.75];

/* ---------- snapped drawing helpers ---------- */
function R(x, y, w, h){
  if (w <= 0 || h <= 0) return;
  var x0 = Math.round(x * Q), y0 = Math.round(y * Q);
  var x1 = Math.round((x + w) * Q), y1 = Math.round((y + h) * Q);
  if (x1 <= x0) x1 = x0 + 1;
  if (y1 <= y0) y1 = y0 + 1;
  ctx.fillRect(x0, y0, x1 - x0, y1 - y0);
}
function SPRD(img, x, y, w, h){
  var x0 = Math.round(x * Q), y0 = Math.round(y * Q);
  var x1 = Math.round((x + w) * Q), y1 = Math.round((y + h) * Q);
  if (x1 <= x0 || y1 <= y0) return;
  ctx.drawImage(img, x0, y0, x1 - x0, y1 - y0);
}

/* ---------- tiny 3x5 font ---------- */
var FD = {
'0':'111101101101111','1':'010110010010111','2':'111001111100111','3':'111001111001111',
'4':'101101111001001','5':'111100111001111','6':'111100111101111','7':'111001001001001',
'8':'111101111101111','9':'111101111001111',
'A':'010101111101101','B':'110101110101110','C':'011100100100011','D':'110101101101110',
'E':'111100110100111','F':'111100110100100','G':'011100101101011','H':'101101111101101',
'I':'111010010010111','J':'001001001101010','K':'101101110101101','L':'100100100100111',
'M':'101111111101101','N':'110101101101101','O':'010101101101010','P':'110101110100100',
'Q':'010101101110011','R':'110101110101101','S':'011100010001110','T':'111010010010010',
'U':'101101101101111','V':'101101101101010','W':'101101111111101','X':'101101010101101',
'Y':'101101010010010','Z':'111001010100111',
'-':'000000111000000',':':'000010000010000','!':'010010010000010','.':'000000000000010'
};
function txtXY(s, x, y, sx, sy, col, align){
  s = String(s).toUpperCase();
  var w = s.length * 4 * sx - sx;
  if (align === 'c') x = x - w / 2;
  else if (align === 'r') x = x - w;
  ctx.fillStyle = col;
  for (var i = 0; i < s.length; i++){
    var g = FD[s.charAt(i)];
    if (!g) continue;
    var gx = x + i * 4 * sx;
    for (var r = 0; r < 5; r++){
      var c0 = -1;
      for (var c = 0; c <= 3; c++){
        var on = (c < 3) && g.charAt(r * 3 + c) === '1';
        if (on && c0 < 0) c0 = c;
        if (!on && c0 >= 0){ R(gx + c0 * sx, y + r * sy, (c - c0) * sx, sy); c0 = -1; }
      }
    }
  }
}
function txt(s, x, y, sc, col, align){ txtXY(s, x, y, sc, sc, col, align); }
function txtS(s, x, y, sc, col, align){
  txt(s, x + sc * 0.7, y + sc * 0.7, sc, '#000', align);
  txt(s, x, y, sc, col, align);
}

/* ---------- colour helpers ---------- */
function parseHex(h){ return [parseInt(h.substr(1,2),16), parseInt(h.substr(3,2),16), parseInt(h.substr(5,2),16)]; }
function mix(a, b, t){ return [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, a[2]+(b[2]-a[2])*t]; }
function rgbs(c){ return 'rgb(' + (c[0]|0) + ',' + (c[1]|0) + ',' + (c[2]|0) + ')'; }
function clamp(v, a, b){ return v < a ? a : (v > b ? b : v); }
function pad(v, n){ v = String(v); while (v.length < n) v = '0' + v; return v; }

/* slots: sky0..sky3, ground, road lines, hills */
var DAYC   = ['#2424dc','#2424dc','#2424dc','#2424dc','#286c20','#dcf0d4','#cfc844'];
var DUSKC  = ['#2c1c7c','#5a2a84','#c0504c','#f0a040','#1e4c1c','#b8a890','#8c6a34'];
var NIGHTC = ['#000000','#000000','#000008','#02020c','#000000','#10160f','#000000'];
var DAWNC  = ['#20206c','#3c3c9c','#8c78b8','#e8a878','#20581e','#c4cac0','#a89860'];
var KEYS = [
  {u:0.00, c:DAYC}, {u:0.30, c:DAYC}, {u:0.46, c:DUSKC}, {u:0.58, c:NIGHTC},
  {u:0.80, c:NIGHTC}, {u:0.92, c:DAWNC}, {u:1.00, c:DAYC}
];
var i0;
for (i0 = 0; i0 < KEYS.length; i0++) KEYS[i0].p = KEYS[i0].c.map(parseHex);
function getPal(u){
  var i = 0;
  while (i < KEYS.length - 2 && u >= KEYS[i+1].u) i++;
  var a = KEYS[i], b = KEYS[i+1];
  var t = clamp((u - a.u) / (b.u - a.u), 0, 1);
  var out = [];
  for (var j = 0; j < 7; j++) out.push(mix(a.p[j], b.p[j], t));
  return out;
}
function nightAmt(u){
  if (u < 0.40) return 0;
  if (u < 0.54) return (u - 0.40) / 0.14;
  if (u < 0.82) return 1;
  if (u < 0.94) return 1 - (u - 0.82) / 0.12;
  return 0;
}
function weatherAmt(u){
  if (u < 0.04 || u > 0.40) return 0;
  if (u < 0.10) return (u - 0.04) / 0.06;
  if (u > 0.34) return (0.40 - u) / 0.06;
  return 1;
}
var FOGC = [205, 212, 222], SNOWC = [236, 242, 255];

/* ---------- Enduro car sprite (rear view, 32x13) ---------- */
function rep(c, n){ var s = ''; while (n-- > 0) s += c; return s; }
var CARROWS = (function(){
  var ears = rep('.',6) + rep('B',5) + rep('.',10) + rep('B',5) + rep('.',6);
  var body = rep('.',5) + rep('B',22) + rep('.',5);
  var full = rep('B',32);
  var low  = rep('B',5) + rep('.',3) + rep('B',16) + rep('.',3) + rep('B',5);
  var narrow = rep('.',8) + rep('B',16) + rep('.',8);
  return [ears, ears, body, full, body, full, body, full, body, full, low, narrow, low];
})();
function makeCar(col){
  var c = document.createElement('canvas'); c.width = 32; c.height = 13;
  var g = c.getContext('2d');
  g.fillStyle = col;
  for (var r = 0; r < 13; r++){
    for (var x = 0; x < 32; x++){
      if (CARROWS[r].charAt(x) === 'B') g.fillRect(x, r, 1, 1);
    }
  }
  c._col = col;
  return c;
}
var ECOLS = ['#d4cc48','#4a88e0','#58a8e8','#50d8c0','#e08840','#e070a0','#90d048','#a8a0e8'];
var CARS = [], PLCAR, k0;
for (k0 = 0; k0 < ECOLS.length; k0++) CARS.push(makeCar(ECOLS[k0]));
PLCAR = makeCar('#f4f4f4');
var ICONCAR = makeCar('#000000');

/* in-game clock: maps the day cycle (0..1) to hours, so the HUD shows morning / evening / night */
var CLK = [[0, 7], [0.46, 18], [0.58, 20], [0.80, 27], [0.92, 29.5], [1, 31]];
function clockStr(u){
  var i = 0, h;
  while (i < CLK.length - 2 && u >= CLK[i + 1][0]) i++;
  var a = CLK[i], b = CLK[i + 1];
  h = a[1] + (b[1] - a[1]) * clamp((u - a[0]) / (b[0] - a[0]), 0, 1);
  h = h % 24;
  var hh = Math.floor(h), mm = Math.floor((h - hh) * 60);
  return pad(hh, 2) + ':' + pad(mm, 2);
}
function sndX(){ return isLand ? W - 34 : W - 4; }

/* ---------- low flat hills on the horizon ---------- */
var PN = 1024, PROF = [];
(function(){
  var i; for (i = 0; i < PN; i++) PROF.push(0);
  var pos = 20;
  while (pos < PN - 140){
    var hw = 40 + Math.floor(Math.random() * 70), hh = 3 + Math.random() * 5.5;
    for (i = 0; i < hw; i++){
      var t = (i / (hw - 1)) * 2 - 1;
      PROF[pos + i] = Math.round(Math.pow(1 - t * t, 0.65) * hh * 2) / 2;
    }
    pos += hw + 60 + Math.floor(Math.random() * 220);
  }
})();

/* ---------- state ---------- */
var state = 'title';
var day = 1, dayT = 0, carsLeft = 200, quotaMet = false, passedTotal = 0;
var odo = 0, speed = 30, lane = 1, laneL = LANES[1];
var mScroll = 0, posCam = 0;
var segZ = [6, 13, 20], segS = [0, 0, 0, 0];
var cars = [], spawnT = 1, laneV = [50, 62, 56, 70];
var hitT = 0, shake = 0, boostT = 0, boostCD = 0, brakeT = 0;
var banner = null, flagT = 0, flagType = 'green', overT = 0;
var tG = 0, muted = false, best = 0;
var flakes = [];
(function(){ for (var i = 0; i < 50; i++) flakes.push({x: Math.random()*460, y: Math.random()*340, v: 25 + Math.random()*30, d: Math.random()*6}); })();
try { best = parseInt(localStorage.getItem('enduro_best') || '0', 10) || 0; } catch (e0) {}
try { localStorage.removeItem('enduro_mode'); } catch (e1) {}

/* ---------- layout ---------- */
function layout(){
  PANEL = isLand ? 58 : 86;
  TOPPAD = isLand ? 6 : 14;
  roadBottom = H - PANEL;
  horizon = Math.floor(roadBottom * (isLand ? 0.33 : 0.29));
  roadH = roadBottom - horizon;
  HWB = roadH * (isLand ? 0.88 : 0.55);
  CARK = 0.33 * HWB;
}
function resize(){
  vw = window.innerWidth; vh = window.innerHeight; dpr = window.devicePixelRatio || 1;
  /* phone held upright -> tall layout that fills the whole screen;
     phone held sideways -> wide layout. Follows the real window size. */
  isLand = vw > vh;
  if (isLand){ H = 200; W = clamp(Math.round(H * vw / vh), 260, 460); }
  else { W = 160; H = clamp(Math.round(W * vh / vw), 200, 400); }
  Q = Math.min(vw / W, vh / H) * dpr;
  var maxQ = Math.sqrt(12000000 / (W * H));
  if (Q > maxQ) Q = maxQ;
  var cw = Math.max(1, Math.floor(W * Q)), ch = Math.max(1, Math.floor(H * Q));
  cv.width = cw; cv.height = ch;
  cv.style.width = (cw / dpr) + 'px';
  cv.style.height = (ch / dpr) + 'px';
  ctx.imageSmoothingEnabled = false;
  layout();
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', function(){ setTimeout(resize, 150); });
resize();

/* ---------- road shape: piecewise-straight, with kinks like the original ---------- */
function newSlope(){ return Math.random() < 0.4 ? 0 : (Math.random() * 2 - 1) * 0.2 * HWB; }
function resetRoad(){ segZ = [6, 13, 20]; segS = [0, 0, 0, 0]; }
function advanceRoad(dt){
  var dz = speed * ZS * dt, k;
  for (k = 0; k < segZ.length; k++) segZ[k] -= dz;
  if (segZ[0] < 1.0){
    segZ.shift(); segS.shift();
    segZ.push(segZ[segZ.length - 1] + 5 + Math.random() * 7);
    segS.push(newSlope());
  }
  mScroll += segS[0] * speed * 0.0035 * dt;
  posCam += dz;
}
function ctrAt(p){
  var c = 0, pa = 1, k, pb;
  for (k = 0; k < segZ.length; k++){
    pb = 1 / segZ[k];
    if (pb < p) pb = p;
    if (pb < pa){ c += segS[k] * (pa - pb); pa = pb; }
    if (pa <= p) return W / 2 + c;
  }
  c += segS[segZ.length] * (pa - p);
  return W / 2 + c;
}

/* ---------- audio ---------- */
var AC = null, master, engOsc, engGain, lfo, lfoGain, filt;
function initAudio(){
  if (AC){ if (AC.state === 'suspended') AC.resume(); return; }
  try {
    var C = window.AudioContext || window.webkitAudioContext;
    AC = new C();
  } catch (e) { AC = null; return; }
  master = AC.createGain(); master.gain.value = muted ? 0 : 0.9; master.connect(AC.destination);
  engOsc = AC.createOscillator(); engOsc.type = 'sawtooth'; engOsc.frequency.value = 60;
  filt = AC.createBiquadFilter(); filt.type = 'lowpass'; filt.frequency.value = 500;
  engGain = AC.createGain(); engGain.gain.value = 0;
  lfo = AC.createOscillator(); lfo.type = 'square'; lfo.frequency.value = 14;
  lfoGain = AC.createGain(); lfoGain.gain.value = 0;
  engOsc.connect(filt); filt.connect(engGain); engGain.connect(master);
  lfo.connect(lfoGain); lfoGain.connect(engGain.gain);
  engOsc.start(); lfo.start();
  try {
    var b = AC.createBuffer(1, 1, 22050), s = AC.createBufferSource();
    s.buffer = b; s.connect(AC.destination); s.start(0);
  } catch (e2) {}
}
function beep(f, d, type, vol, f2, at){
  if (!AC || muted) return;
  var t = AC.currentTime + (at || 0);
  var o = AC.createOscillator(), g = AC.createGain();
  o.type = type || 'square';
  o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
  g.gain.setValueAtTime(vol || 0.08, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g); g.connect(master);
  o.start(t); o.stop(t + d + 0.03);
}
function noise(d, vol, fc){
  if (!AC || muted) return;
  var len = Math.floor(AC.sampleRate * d);
  var buf = AC.createBuffer(1, len, AC.sampleRate);
  var data = buf.getChannelData(0);
  for (var i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / len);
  var s = AC.createBufferSource(); s.buffer = buf;
  var f = AC.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = fc || 900;
  var g = AC.createGain(); g.gain.value = vol || 0.2;
  s.connect(f); f.connect(g); g.connect(master); s.start();
}
function melody(notes, step, type, vol, last){
  for (var i = 0; i < notes.length; i++){
    var d = (i === notes.length - 1 && last) ? last : step * 0.9;
    beep(notes[i], d, type, vol, null, i * step);
  }
}
function sfxPass(){ beep(1320, 0.04, 'square', 0.03); }
function sfxTick(){ beep(420, 0.03, 'square', 0.03); }
function sfxCrash(){ noise(0.38, 0.35, 700); beep(140, 0.3, 'square', 0.12, 40); }
function sfxTurbo(){ noise(0.5, 0.12, 2400); beep(220, 0.45, 'sawtooth', 0.05, 660); }
function sfxStart(){ melody([262, 330, 392, 523], 0.1, 'square', 0.07, 0.35); }
function sfxQuota(){ melody([784, 1047, 784, 1047], 0.09, 'square', 0.06, 0.2); }
function sfxGreen(){ melody([523, 659, 784, 1047, 784, 1047], 0.13, 'square', 0.08, 0.6); }
function sfxRed(){ melody([392, 349, 330, 262, 247, 196], 0.2, 'sawtooth', 0.07, 0.7); }
function updEngine(){
  if (!AC) return;
  var on = (state === 'play') && !muted;
  var t = AC.currentTime;
  engGain.gain.setTargetAtTime(on ? 0.045 : 0, t, 0.08);
  lfoGain.gain.setTargetAtTime(on ? 0.025 : 0, t, 0.08);
  engOsc.frequency.setTargetAtTime(46 + speed * 0.85, t, 0.06);
  lfo.frequency.setTargetAtTime(8 + speed * 0.11, t, 0.06);
  filt.frequency.setTargetAtTime(260 + speed * 2.4, t, 0.06);
}
function toggleMute(){
  muted = !muted;
  if (master) master.gain.value = muted ? 0 : 0.9;
}

/* ---------- game flow ---------- */
function shuffle(a){
  for (var i = a.length - 1; i > 0; i--){
    var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t;
  }
}
function beginDay(){
  dayT = 0; carsLeft = day === 1 ? 200 : 300; quotaMet = false;
  cars.length = 0; spawnT = 1.2;
  var base = [50, 62, 56, 70], k = 1 + Math.min(0.5, (day - 1) * 0.06);
  shuffle(base);
  for (var i = 0; i < 4; i++) laneV[i] = base[i] * k + (Math.random() * 6 - 3);
  banner = {text: 'DAY ' + day, t: 2.6};
}
function startGame(){
  day = 1; passedTotal = 0; odo = 0; speed = 30; lane = 1; laneL = LANES[1];
  boostT = 0; brakeT = 0; boostCD = 0; hitT = 0; shake = 0;
  resetRoad();
  beginDay();
  state = 'play';
  sfxStart();
}
function endDay(){
  state = 'flag';
  flagT = 0;
  flagType = quotaMet ? 'green' : 'red';
  if (quotaMet) sfxGreen();
  else {
    sfxRed();
    if (passedTotal > best){
      best = passedTotal;
      try { localStorage.setItem('enduro_best', String(best)); } catch (e) {}
    }
  }
}
function gestureStart(){
  if (state === 'title'){ startGame(); return true; }
  if (state === 'over'){ if (overT > 0.7) startGame(); return true; }
  return state !== 'play';
}
function steer(d){
  if (gestureStart()) return;
  var nl = clamp(lane + d, 0, 3);
  if (nl !== lane){ lane = nl; sfxTick(); }
}
function turbo(){
  if (gestureStart()) return;
  if (boostCD <= 0){ boostT = 2.5; boostCD = 7; sfxTurbo(); }
}
function brake(){
  if (gestureStart()) return;
  brakeT = 0.6; boostT = 0;
}
function tapAt(clientX, clientY){
  var r = cv.getBoundingClientRect();
  var cx = (clientX - r.left) / r.width * W;
  var cy = (clientY - r.top) / r.height * H;
  if (cx > sndX() - 32 && cy < TOPPAD + 22){ toggleMute(); return; }
  if (state === 'title'){ startGame(); return; }
  if (state === 'play') steer(cx < W / 2 ? -1 : 1);
  else steer(0);
}

/* ---------- input ---------- */
var ptr = null;
window.addEventListener('pointerdown', function(e){
  e.preventDefault();
  initAudio();
  ptr = {x: e.clientX, y: e.clientY, done: false};
}, {passive: false});
window.addEventListener('pointermove', function(e){
  if (!ptr || ptr.done) return;
  var dx = e.clientX - ptr.x, dy = e.clientY - ptr.y;
  var th = Math.max(18, Math.min(vw, vh) * 0.05);
  if (Math.abs(dx) > th || Math.abs(dy) > th){
    ptr.done = true;
    if (Math.abs(dx) > Math.abs(dy)) steer(dx > 0 ? 1 : -1);
    else if (dy < 0) turbo();
    else brake();
  }
}, {passive: false});
window.addEventListener('pointerup', function(e){
  if (!ptr) return;
  if (!ptr.done) tapAt(e.clientX, e.clientY);
  ptr = null;
}, {passive: false});
window.addEventListener('pointercancel', function(){ ptr = null; });

/* no zoom, no scroll, no double-tap zoom, no context menu */
var lastTouchEnd = 0;
document.addEventListener('touchstart', function(e){ if (e.touches.length > 1) e.preventDefault(); }, {passive: false});
document.addEventListener('touchmove', function(e){ e.preventDefault(); }, {passive: false});
document.addEventListener('touchend', function(e){
  var n = Date.now();
  if (n - lastTouchEnd < 350) e.preventDefault();
  lastTouchEnd = n;
}, {passive: false});
document.addEventListener('gesturestart', function(e){ e.preventDefault(); });
document.addEventListener('gesturechange', function(e){ e.preventDefault(); });
document.addEventListener('contextmenu', function(e){ e.preventDefault(); });
document.addEventListener('dblclick', function(e){ e.preventDefault(); });

window.addEventListener('keydown', function(e){
  initAudio();
  var k = e.key;
  if (k === 'ArrowLeft' || k === 'a' || k === 'A') steer(-1);
  else if (k === 'ArrowRight' || k === 'd' || k === 'D') steer(1);
  else if (k === 'ArrowUp' || k === ' ') turbo();
  else if (k === 'ArrowDown') brake();
  else if (k === 'm' || k === 'M') toggleMute();
  if (k === ' ' || k.indexOf('Arrow') === 0) e.preventDefault();
});
document.addEventListener('visibilitychange', function(){
  if (!AC) return;
  if (document.hidden) AC.suspend(); else AC.resume();
});

/* ---------- cars ---------- */
function laneBusy(l){
  for (var i = 0; i < cars.length; i++) if (cars[i].lane === l && cars[i].zw > ZMAX - 4) return true;
  return false;
}
function spawnCar(){
  var occ = {}, cnt = 0, i;
  for (i = 0; i < cars.length; i++){
    if (cars[i].zw > ZMAX - 7 && !occ[cars[i].lane]){ occ[cars[i].lane] = 1; cnt++; }
  }
  if (cnt >= 3) return;
  var free = [];
  for (i = 0; i < 4; i++) if (!laneBusy(i)) free.push(i);
  if (!free.length) return;
  var l = free[Math.floor(Math.random() * free.length)];
  cars.push({lane: l, L: LANES[l], zw: ZMAX, prev: ZMAX, v: laneV[l], c: Math.floor(Math.random() * CARS.length), hit: false, counted: false});
}
function crash(c){
  c.hit = true;
  speed = Math.min(speed * 0.3, c.v * 0.7);
  hitT = 0.6; shake = 0.5; boostT = 0;
  sfxCrash();
}
function passed(){
  carsLeft = Math.max(0, carsLeft - 1);
  passedTotal++;
  sfxPass();
  if (carsLeft === 0 && !quotaMet){
    quotaMet = true;
    banner = {text: 'QUOTA MET!', t: 2.2};
    sfxQuota();
  }
}

/* ---------- update ---------- */
function update(dt){
  tG += dt;
  if (banner){ banner.t -= dt; if (banner.t <= 0) banner = null; }
  if (shake > 0) shake = Math.max(0, shake - dt);
  if (hitT > 0) hitT -= dt;
  laneL += (LANES[lane] - laneL) * Math.min(1, dt * 14);

  if (state === 'play'){
    dayT += dt;
    var maxSpd = Math.min(230, 130 + (day - 1) * 12);
    var target = maxSpd;
    if (boostT > 0){ target = Math.min(270, maxSpd * 1.3); boostT -= dt; }
    if (brakeT > 0){ target = 45; brakeT -= dt; }
    boostCD -= dt;
    if (speed < target) speed = Math.min(target, speed + 30 * dt);
    else speed = Math.max(target, speed - (brakeT > 0 ? 110 : 45) * dt);

    odo += speed / 3600 * dt;
    advanceRoad(dt);

    var u = dayT / DAYLEN;
    spawnT -= dt;
    if (spawnT <= 0 && u < 0.985){
      spawnCar();
      var base = 0.56 * (110 / Math.max(60, speed));
      var f = day === 1 ? 1 : 0.62;
      spawnT = base * f * (0.65 + Math.random() * 0.7);
    }

    for (var i = cars.length - 1; i >= 0; i--){
      var c = cars[i];
      c.prev = c.zw;
      c.zw += (c.v - speed) * ZS * dt;
      if (!c.hit && c.zw <= ZHI && c.prev >= ZLO && Math.abs(c.L - laneL) < LAT) crash(c);
      if (!c.counted && c.zw < ZPASS){ c.counted = true; passed(); }
      if (c.zw < 0.4 || c.zw > ZMAX + 4) cars.splice(i, 1);
    }
    if (dayT >= DAYLEN) endDay();
  } else if (state === 'title'){
    speed = 70;
    advanceRoad(dt);
  } else if (state === 'flag'){
    flagT += dt;
    if (flagType === 'green' && flagT > 3.8){
      day++; beginDay(); state = 'play';
    } else if (flagType === 'red' && flagT > 1.8){
      state = 'over'; overT = 0;
    }
  } else if (state === 'over'){
    overT += dt;
  }
  updEngine();
}

/* ---------- render ---------- */
function drawFlag(t, color, px, top){
  var fw = 112, fh = 56, cx, off, pl = Math.min(112, roadBottom - (top - 8) - 2);
  ctx.fillStyle = '#d0d0d0'; R(px, top - 8, 3, pl);
  ctx.fillStyle = '#f0c030'; R(px - 1, top - 11, 5, 4);
  for (cx = 0; cx < fw; cx++){
    off = Math.sin(t * 7 + cx * 0.13) * 3 * (cx / fw + 0.2);
    ctx.fillStyle = color; R(px + 3 + cx, top + off, 1.05, fh);
    if (Math.floor(cx / 6) % 2){ ctx.fillStyle = 'rgba(0,0,0,0.18)'; R(px + 3 + cx, top + off, 1.05, fh); }
  }
}
function drawCheckerBanner(){
  var cx, ty, off;
  for (cx = 0; cx < W; cx += 2){
    off = Math.sin(tG * 5 + cx * 0.12) * 2;
    for (ty = 0; ty < 8; ty += 4){
      ctx.fillStyle = ((Math.floor(cx / 4) + ty / 4) % 2) ? '#f4f4f4' : '#101010';
      R(cx, TOPPAD + 6 + off + ty, 2.05, 4);
    }
  }
}
function drawCarShape(img, x, yb, w, h, alpha){
  if (alpha <= 0.02) return;
  ctx.globalAlpha = clamp(alpha, 0, 1);
  if (w < 6){
    ctx.fillStyle = img._col;
    R(x - w / 2, yb - h * 0.55, w, h * 0.55 + 0.2);
    R(x - w * 0.3, yb - h, w * 0.6, h * 0.5);
  } else {
    SPRD(img, x - w / 2, yb - h, w, h);
  }
  ctx.globalAlpha = 1;
}
function drawTailLights(x, yb, w, h, a){
  ctx.globalAlpha = clamp(a, 0, 1);
  ctx.fillStyle = '#ff2a2a';
  var tl = Math.max(0.8, w * 0.1);
  R(x - w * 0.32 - tl / 2, yb - h * 0.6, tl, tl * 0.7);
  R(x + w * 0.32 - tl / 2, yb - h * 0.6, tl, tl * 0.7);
  ctx.globalAlpha = 1;
}
function drawCar(c, n, fogv, bodyA){
  var p = 1 / c.zw;
  if (p < 0.02 || p > 1.6) return;
  var yb = horizon + p * roadH;
  if (yb > roadBottom + 24) return;
  var x = ctrAt(p) + (c.L - laneL) * HWB * p;
  var w = CARK * p, h = w * 13 / 32;
  var fa = 1 - fogv * Math.pow(1 - p, 0.6) * 0.92;
  drawCarShape(CARS[c.c], x, yb, w, h, bodyA * fa);
  if (n > 0.3) drawTailLights(x, yb, w, h, n * fa);
}
function drawPlayer(n, bodyA){
  var p = PLAYERP, yb = horizon + p * roadH;
  var x = ctrAt(p);
  if (hitT > 0) x += (Math.random() * 2 - 1) * 1.2;
  var w = CARK * p, h = w * 13 / 32;
  drawCarShape(PLCAR, x, yb, w, h, bodyA);
  if (n > 0.3) drawTailLights(x, yb, w, h, n);
  if (boostT > 0){
    ctx.fillStyle = (tG * 20 % 2 < 1) ? '#ffd23f' : '#ff7a1a';
    R(x - w * 0.28, yb, 1.6, 2.5);
    R(x + w * 0.28 - 1.6, yb, 1.6, 2.5);
  }
}
function drawIcon(x, y){
  /* the little race car next to the counter: same sprite as the cars on the road */
  SPRD(ICONCAR, x, y, 15, 15 * 13 / 32);
}
function drawHUD(){
  var py = roadBottom;
  ctx.fillStyle = '#000'; R(0, py, W, PANEL + 1);
  var BW = 132, BH = 42, bx = Math.round((W - BW) / 2), by = py + (isLand ? 5 : 8);
  var OR = '#e2a24e', BK = '#000';
  ctx.fillStyle = '#d02c1a'; R(bx, by, BW, BH);
  /* odometer strip */
  var sx0 = bx + 16, sw = 99, sy0 = by + 4, sh = 13;
  ctx.fillStyle = OR; R(sx0, sy0, sw, sh);
  var od = clockStr(clamp(dayT / DAYLEN, 0, 1));
  var dw = 16, total = 5 * dw - 4, xd = sx0 + sw - 3 - total, lastX = xd + 4 * dw;
  txtXY(od.substr(0, 4), xd, sy0 + 1.5, 4, 2, BK);
  ctx.fillStyle = BK; R(lastX - 3, sy0, sx0 + sw - (lastX - 3), sh);
  txtXY(od.charAt(4), lastX, sy0 + 1.5, 4, 2, OR);
  /* day box + cars-to-pass box */
  var ry = by + 24;
  ctx.fillStyle = OR; R(bx + 16, ry, 17, 13);
  var ds = String(day), dsx = ds.length > 1 ? 2 : 4;
  txtXY(ds, bx + 16 + (17 - (ds.length * 4 * dsx - dsx)) / 2, ry + 1.5, dsx, 2, BK);
  ctx.fillStyle = OR; R(bx + 49, ry, 66, 13);
  drawIcon(bx + 52, ry + 3.5);
  txtXY(pad(carsLeft, 3), bx + 49 + 66 - 3 - 44, ry + 1.5, 4, 2, BK);
  /* label */
  var lx = isLand ? 28 : 8, lsc = (!isLand || bx - lx - 6 >= 78) ? 2 : 1;
  txt('ENG. ISLAM', lx, isLand ? by + 14 : by + BH + 7, lsc, '#dcdcdc');
}

function render(){
  var u = Math.min(1, dayT / DAYLEN);
  if (state === 'title') u = 0.04;
  var n = nightAmt(u);
  var wt = (state === 'title') ? 0 : ((day - 1) % 3);
  var wamt = weatherAmt(u);
  var snow = wt === 1 ? wamt : 0, fog = wt === 2 ? wamt : 0;
  var pal = getPal(u);
  var i, y, p;
  var sk = [pal[0], pal[1], pal[2], pal[3]], gnd = pal[4], ln = pal[5], mt = pal[6];
  if (fog > 0){
    for (i = 0; i < 4; i++) sk[i] = mix(sk[i], FOGC, fog * 0.85);
    mt = mix(mt, FOGC, fog * 0.6);
  }
  if (snow > 0){
    gnd = mix(gnd, SNOWC, snow);
    mt = mix(mt, [236, 240, 250], snow * 0.7);
    ln = mix(ln, [150, 160, 170], snow * 0.4);
  }

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.imageSmoothingEnabled = false;
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.save();
  if (shake > 0) ctx.translate(Math.round((Math.random() * 2 - 1) * 1.5 * Q), 0);

  /* sky */
  var bh = horizon / 4;
  for (i = 0; i < 4; i++){ ctx.fillStyle = rgbs(sk[i]); R(-4, i * bh, W + 8, bh + 0.3); }

  /* hills */
  ctx.fillStyle = rgbs(mt);
  var runH = -1, runX = 0, x, idx, hh;
  for (x = -1; x <= W + 1; x += 0.5){
    idx = ((Math.floor((x + mScroll) * 2) % PN) + PN) % PN;
    hh = PROF[idx];
    if (hh !== runH){
      if (runH > 0) R(runX, horizon - runH, x - runX, runH + 0.4);
      runH = hh; runX = x;
    }
  }
  if (runH > 0) R(runX, horizon - runH, x - runX, runH + 0.4);

  /* ground */
  if (fog > 0){
    for (y = horizon; y < roadBottom; y += 2){
      p = (y + 1 - horizon) / roadH;
      ctx.fillStyle = rgbs(mix(gnd, FOGC, fog * Math.pow(1 - p, 0.5) * 0.95));
      R(-4, y, W + 8, 2.3);
    }
  } else {
    ctx.fillStyle = rgbs(gnd); R(-4, horizon, W + 8, roadH + 0.3);
  }

  /* thin dotted road edge lines */
  var STEP = 0.5, lnStr = rgbs(ln);
  ctx.fillStyle = lnStr;
  for (y = horizon + STEP; y <= roadBottom + 0.001; y += STEP){
    p = (y - horizon) / roadH;
    if (p > 0.3 && ((Math.floor((1 / p + posCam) * 5) & 3) === 0)) continue;
    var hw = HWB * p, c = ctrAt(p);
    var lx = c - (1 + laneL) * hw, rx = c + (1 - laneL) * hw, lw = 0.6 + p * 1.6;
    if (fog > 0) ctx.fillStyle = rgbs(mix(ln, FOGC, fog * Math.pow(1 - p, 0.5) * 0.95));
    R(lx - lw / 2, y - STEP, lw, STEP + 0.05);
    R(rx - lw / 2, y - STEP, lw, STEP + 0.05);
  }

  /* cars */
  var bodyA = clamp(1 - n * 1.3, 0, 1);
  cars.sort(function(a, b){ return b.zw - a.zw; });
  for (i = 0; i < cars.length; i++) drawCar(cars[i], n, fog, bodyA);
  if (state !== 'title') drawPlayer(n, bodyA);

  /* turbo streaks */
  if (boostT > 0 && state === 'play'){
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    for (i = 0; i < 4; i++){
      var sy = horizon + 20 + Math.random() * (roadH - 40);
      R(W * 0.5 - HWB * 0.9 - 10 + Math.random() * 14, sy, 0.8, 8);
      R(W * 0.5 + HWB * 0.9 - 4 + Math.random() * 14, sy, 0.8, 8);
    }
  }

  /* snowfall */
  if (snow > 0.15){
    ctx.fillStyle = 'rgba(255,255,255,' + (0.4 + snow * 0.5) + ')';
    for (i = 0; i < flakes.length; i++){
      var fl = flakes[i];
      fl.y += fl.v * 0.016; fl.x += Math.sin(tG * 2 + fl.d) * 0.2;
      if (fl.y > roadBottom){ fl.y = 0; fl.x = Math.random() * W; }
      if (fl.x < W) R(fl.x, fl.y, 0.9, 0.9);
    }
  }
  ctx.restore();

  /* ---------- HUD ---------- */
  drawHUD();
  txtS('SND', sndX(), TOPPAD + 2, 2, muted ? '#707078' : '#ffffff', 'r');

  if (banner && state === 'play'){
    var ba = banner.t < 0.5 ? banner.t / 0.5 : 1;
    ctx.globalAlpha = clamp(ba, 0, 1);
    txtS(banner.text, W / 2, TOPPAD + (isLand ? 14 : 24), 3, '#ffffff', 'c');
    ctx.globalAlpha = 1;
  }

  /* ---------- overlays ---------- */
  var blink = (tG * 2.2 % 2) < 1.3;
  var tx = isLand ? W / 2 + 40 : W / 2;
  var fpx = Math.round(isLand ? W / 2 - 150 : W / 2 - 58);
  var ftop = TOPPAD + (isLand ? 30 : 36);
  var ty0 = TOPPAD + (isLand ? 20 : 112);
  if (state === 'title'){
    drawCheckerBanner();
    var cols = ['#e83030', '#f08020', '#f0d020', '#38b848', '#3c68e8', '#c050d8'];
    var word = 'ENDURO', x0 = W / 2 - 57, tyT = TOPPAD + (isLand ? 22 : 35);
    for (i = 0; i < word.length; i++){
      txt(word.charAt(i), x0 + i * 20 + 1, tyT + 1, 5, '#000');
      txt(word.charAt(i), x0 + i * 20, tyT, 5, cols[i]);
    }
    if (!isLand) txtS('RACING', W / 2, TOPPAD + 66, 2, '#ffffff', 'c');
    if (blink) txtS('TAP TO START', W / 2, horizon + (isLand ? 8 : 40), 2, '#ffffff', 'c');
    var iy = horizon + (isLand ? 32 : 76), isp = isLand ? 10 : 12;
    txtS('TAP SIDES TO STEER', W / 2, iy, 1, '#ffffff', 'c');
    txtS('SWIPE UP FOR TURBO', W / 2, iy + isp, 1, '#ffffff', 'c');
    txtS('SWIPE DOWN TO BRAKE', W / 2, iy + isp * 2, 1, '#ffffff', 'c');
    if (best > 0) txtS('BEST ' + best + ' CARS', W / 2, isLand ? horizon + 66 : roadBottom - 16, 2, '#ffd23f', 'c');
  } else if (state === 'flag'){
    if (flagType === 'green'){
      drawFlag(tG, '#2eb84a', fpx, ftop);
      txtS('DAY ' + day, tx, ty0, 3, '#ffffff', 'c');
      txtS('COMPLETE!', tx, ty0 + 28, 3, '#ffd23f', 'c');
    } else {
      drawFlag(tG, '#d02828', fpx, ftop);
    }
  } else if (state === 'over'){
    drawFlag(tG, '#d02828', fpx, ftop);
    txtS('GAME OVER', tx, ty0, 3, '#ffffff', 'c');
    txtS('DAY ' + day, tx, ty0 + 32, 2, '#ffd23f', 'c');
    txtS('PASSED ' + passedTotal, tx, ty0 + 48, 2, '#ffffff', 'c');
    txtS('BEST ' + best, tx, ty0 + 64, 2, '#ffffff', 'c');
    if (overT > 0.7 && blink) txtS('TAP TO RETRY', tx, ty0 + 90, 2, '#3ddc5c', 'c');
  }
}

/* ---------- loop ---------- */
var last = 0;
function frame(ts){
  if (window.innerWidth !== vw || window.innerHeight !== vh) resize();
  if (!last) last = ts;
  var dt = (ts - last) / 1000;
  last = ts;
  if (dt > 0.05) dt = 0.05;
  if (dt < 0) dt = 0;
  update(dt);
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ---------- home screen icon + manifest ---------- */
function buildIcon(){
  var g = document.createElement('canvas'); g.width = 64; g.height = 64;
  var c = g.getContext('2d');
  var x, y, i, k;
  c.fillStyle = '#2424dc'; c.fillRect(0, 0, 64, 28);
  c.fillStyle = '#cfc844';
  for (x = 0; x < 64; x++){
    var h = 0;
    if (x > 6 && x < 30) h = Math.round(Math.pow(1 - Math.pow((x - 18) / 12, 2), 0.65) * 5);
    if (x > 40 && x < 60) h = Math.round(Math.pow(1 - Math.pow((x - 50) / 10, 2), 0.65) * 4);
    if (h > 0) c.fillRect(x, 28 - h, 1, h);
  }
  c.fillStyle = '#286c20'; c.fillRect(0, 28, 64, 36);
  c.fillStyle = '#dcf0d4';
  for (y = 29; y < 64; y++){
    var hw = Math.round((y - 28) * 0.62);
    c.fillRect(32 - hw, y, 1, 1);
    c.fillRect(32 + hw, y, 1, 1);
  }
  c.imageSmoothingEnabled = false;
  c.drawImage(CARS[0], 38, 36, 9, 4);
  c.drawImage(CARS[1], 17, 40, 13, 5);
  c.drawImage(CARS[3], 41, 45, 17, 7);
  c.drawImage(PLCAR, 22, 52, 22, 9);
  var s = 'ENDURO', gl;
  for (i = 0; i < s.length; i++){
    gl = FD[s.charAt(i)];
    for (k = 0; k < 15; k++){
      if (gl.charAt(k) === '1'){
        c.fillStyle = '#000'; c.fillRect(20 + i * 4 + (k % 3) + 1, 4 + Math.floor(k / 3) + 1, 1, 1);
      }
    }
  }
  for (i = 0; i < s.length; i++){
    gl = FD[s.charAt(i)];
    for (k = 0; k < 15; k++){
      if (gl.charAt(k) === '1'){
        c.fillStyle = '#f8d040'; c.fillRect(20 + i * 4 + (k % 3), 4 + Math.floor(k / 3), 1, 1);
      }
    }
  }
  return g;
}
function scaleIcon(src, size){
  var o = document.createElement('canvas'); o.width = size; o.height = size;
  var c = o.getContext('2d'); c.imageSmoothingEnabled = false;
  c.drawImage(src, 0, 0, size, size);
  return o.toDataURL('image/png');
}
function addLink(rel, href, sizes){
  var l = document.createElement('link');
  l.rel = rel; l.href = href;
  if (sizes) l.setAttribute('sizes', sizes);
  document.head.appendChild(l);
}
try {
  var ic = buildIcon();
  var u180 = scaleIcon(ic, 180), u512 = scaleIcon(ic, 512);
  addLink('apple-touch-icon', u180, '180x180');
  addLink('icon', u180);
  var man = {
    name: 'Enduro', short_name: 'Enduro', display: 'fullscreen',
    background_color: '#000000', theme_color: '#000000', start_url: location.href,
    icons: [{src: u512, sizes: '512x512', type: 'image/png'}]
  };
  addLink('manifest', URL.createObjectURL(new Blob([JSON.stringify(man)], {type: 'application/manifest+json'})));
} catch (e3) {}

})();
</script>
